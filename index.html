<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-wrapper">
        <div class="glass-container">
            <header class="reveal">
                <h1>GreenLoader <span class="accent">V7.0</span></h1>
                <p class="tagline">High Quality Media Downloader</p>
            </header>

            <div class="input-group reveal" style="transition-delay: 0.1s;">
                <label>LISTA DE ENLACES</label>
                <textarea id="urlInput" placeholder="Pega los enlaces aquí..."></textarea>
            </div>

            <div class="options-grid">
                <div class="inner-box reveal" style="transition-delay: 0.2s;">
                    <label>FORMATO</label>
                    <div class="selector-tabs">
                        <div id="videoBtn" class="tab active" onclick="setMode('video')">Video</div>
                        <div id="audioBtn" class="tab" onclick="setMode('audio')">Audio</div>
                    </div>
                </div>

                <div class="inner-box reveal" style="transition-delay: 0.3s;">
                    <label>CALIDAD</label>
                    <select id="qualitySelect"></select>
                </div>
            </div>

            <div class="action-area reveal" style="transition-delay: 0.4s;">
                <button id="downloadBtn" onclick="startDownload()">INICIAR PROCESO</button>
                <div class="footer-btns">
                    <button class="secondary-btn" onclick="pywebview.api.open_folder()">ABRIR CARPETA</button>
                    <button class="secondary-btn" onclick="clearAll()">LIMPIAR</button>
                </div>
            </div>

            <div id="output" class="reveal" style="transition-delay: 0.5s;">SISTEMA LISTO</div>
        </div>
    </div>

    <script>
        let currentType = 'video';
        const qualities = {
            video: [{v:'1080', t:'1080p Full HD'}, {v:'720', t:'720p HD'}, {v:'best', t:'Mejor disponible'}],
            audio: [{v:'audio_best', t:'MP3 320kbps'}, {v:'audio_low', t:'MP3 128kbps'}]
        };

        function setMode(type) {
            currentType = type;
            document.getElementById('audioBtn').classList.toggle('active', type === 'audio');
            document.getElementById('videoBtn').classList.toggle('active', type === 'video');
            updateOptions();
        }

        function updateOptions() {
            const select = document.getElementById('qualitySelect');
            select.innerHTML = '';
            qualities[currentType].forEach(q => {
                const opt = document.createElement('option');
                opt.value = q.v; opt.innerText = q.t;
                select.appendChild(opt);
            });
        }

        async function startDownload() {
            const urls = document.getElementById('urlInput').value.trim();
            const quality = document.getElementById('qualitySelect').value;
            const out = document.getElementById('output');
            const btn = document.getElementById('downloadBtn');

            if (!urls) { out.innerText = "Inserte enlaces"; return; }

            btn.disabled = true;
            btn.innerText = "PROCESANDO...";
            out.innerText = "Descargando medios...";

            const res = await pywebview.api.descargar(urls, currentType, quality);
            
            out.innerText = res;
            btn.disabled = false;
            btn.innerText = "INICIAR PROCESO";
        }

        function clearAll() {
            document.getElementById('urlInput').value = "";
            document.getElementById('output').innerText = "Sistema listo";
        }

        updateOptions();
    </script>
</body>
</html>
